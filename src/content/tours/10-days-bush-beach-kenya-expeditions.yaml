title: 10 Days Bush & Beach Kenya Expeditions
summary: >-
  Safari and sea in one trip: Nairobi’s highlights, Hell’s Gate and Lake Naivasha, Lake Nakuru, three
  nights in the Maasai Mara, then a flight to Mombasa for Fort Jesus, the beach and a sunset dhow cruise.
durationDays: 10
destinations: [kenya]
route:
  - Nairobi
  - Lake Naivasha
  - Lake Nakuru
  - Maasai Mara
  - Mombasa
heroImage: ../../assets/images/placeholders/nakuru-flamingos.jpg
heroAlt: Thousands of pink flamingos wading in Lake Nakuru below the forested Rift Valley escarpment
featured: true
order: 3

itinerary:
  - day: 1
    title: Arrival – Nairobi
    description: |-
      Jambo and welcome to Kenya! On arrival at the airport, our experienced guide and the regional Manager will meet you. After a short briefing, you will be transferred to your city hotel to freshen up.

      You will then have an excursion within Kenya’s capital, starting your exploration of this beautiful country with a visit to the David Sheldrick elephant orphanage at 11:00, a nursery and rehabilitation centre for infant elephants that have lost their families, as well as the occasional rhino, zebra and other wildlife. Daphne Sheldrick was the first person to successfully raise an orphaned infant elephant, discovering a formula that has now been used widely. The widow of the famous naturalist and warden of Tsavo from 1948 to 1976, David Sheldrick, Daphne dedicated her life to conservation. These infants are eventually released into the wild at Tsavo East National Park and end up in the care of other orphans who have been successfully reintroduced to the wild.

      After this, you will visit the Carnivore restaurant for lunch, an experience where game meat and the traditional Kenyan delicacy ‘nyama choma’ (meat roasted in a special, Kenyan way) is served.

      After lunch, you will visit the Giraffe Centre close by. The Centre was set up as a breeding centre for the endangered Rothschild giraffe. It was started by Jock Leslie-Melville, the Kenyan grandson of a Scottish Earl, when he and his wife Betty captured a baby giraffe to start a programme of breeding giraffe in captivity at their home in Langata, now home to the Centre. Since then the programme has had huge success, resulting in the introduction of several breeding pairs of Rothschild giraffe into Kenyan national parks.

      You will then be dropped at your 5-star luxury Hotel for dinner and overnight.
    overnight: Sarova Stanley Hotel
    mealPlan: Bed & Breakfast

  - day: 2
    title: Nairobi – Hell’s Gate – Lake Naivasha
    description: |-
      After breakfast at the city Hotel, you will drive to one of the Great Rift Valley’s lakes, Lake Naivasha. First, you will visit Hell’s Gate National Park, famous for its natural hot geysers and eagle and vulture breeding grounds. It is the only Park where visitors can walk or cycle past huge herds of buffalo looking on. The Park has special locations for great viewing including Fischer’s Tower (formerly a volcanic plug), the Central Tower and Njorowa Gorge. The hot springs and fabulous scenic landscape, besides the diverse game, are just incredible.

      After the Park, you will have lunch at the Hotel, then in the afternoon take a leisurely walk on Crescent Island, a private wildlife sanctuary on the eastern side of Lake Naivasha. The island is the submerged rim of a volcanic crater, where you can walk among the yellow-barked “fever trees” with the possibility of seeing various animals. Return later for dinner and overnight at the 5-star luxury Hotel by the lakeside.
    overnight: Lake Naivasha Sopa Lodge
    mealPlan: Full Board (B, L, D)

  - day: 3
    title: Lake Nakuru National Park
    description: |-
      After a sumptuous breakfast at the Hotel, you will drive to another of Kenya’s Great Rift Valley lakes, Lake Nakuru National Park.

      The park offers excellent bird watching and game viewing, with slightly over 315 bird species recorded. Wildlife includes the Eastern black rhino, southern white rhino, Rothschild giraffe, waterbuck, rock pythons, gazelle and baboon among others. Hundreds of lesser flamingos dominate the lake and make it even more attractive. Visit Baboon Cliff for a great view of the entire lake.

      After enjoying the full-day game viewing drive, you will drive back to Lake Naivasha for a restful evening by the lakeside.
    overnight: Lake Naivasha Sopa Lodge
    mealPlan: Full Board (B, L, D)

  - day: 4
    title: Lake Naivasha – Maasai Mara National Reserve
    description: |-
      After a leisurely al fresco breakfast, you will drive to the extraordinary destination of the Maasai Mara. The journey by road takes you across the floor of the Great Rift Valley, where you will notice recent fissures caused by tectonic movements, thought to have been aggravated by heavy rainfall in April 2018. These cut huge, long trenches through farms, roads and even buildings for several kilometres. Arrive at the Maasai Mara Reserve for lunch. After lunch, you will have a rest, and then at about 16:00 an evening game viewing drive.

      The Maasai Mara is perhaps one of the most prolific and famous reserves in Africa. Apart from being home to the famous Big Five (lion, leopard, rhino, African elephant and buffalo) and featuring in hundreds of films including the ‘Big Cat Diaries’, the reserve is celebrated as the Seventh Wonder of the World thanks to the annual wildebeest migration between July and September. This natural phenomenon is quite incredible: over 1.3 million wildebeest cross the Mara River from the Serengeti; many are swept away by currents, and hundreds of predators find easy prey. With crocodiles in the river, lions, cheetahs, hyenas and wild dogs waiting on land and vultures in the skies, it is a spectacle you will never tire of watching.

      Later, before dusk, return for dinner and overnight at your luxury lodge.
    overnight: Keekorok Lodge
    mealPlan: Full Board (B, L, D daily)

  - day: 5
    title: Inside the Maasai Mara Game Reserve
    description: |-
      Today you will have an early wake-up call for an early game drive in this vast reserve, when you are likely to see more wildlife as this is their most active time. Return for breakfast, then mid-morning visit a Maasai village (manyatta) where you will see their traditional beadwork and learn about their culture. After lunch, you will have another game drive until late in the evening. Return for dinner and overnight.
    overnight: Keekorok Lodge
    mealPlan: Full Board (B, L, D daily)

  - day: 6
    title: Inside the Maasai Mara Game Reserve
    description: |-
      Today you may choose a balloon ride, usually followed by a bush breakfast, or take an early game drive and return to the Lodge for breakfast. Spend the mid-morning at leisure, followed by an afternoon game drive along the Mara River to the hippo pool, following the migratory routes of the wildlife. You are likely to see some action, or animals like black-backed jackals, bat-eared foxes, topi, white-tailed mongoose, serval cats, caracal and crested porcupines among others. In the evening you will return to your Lodge for dinner and overnight.
    overnight: Keekorok Lodge
    mealPlan: Full Board (B, L, D daily)

  - day: 7
    title: Maasai Mara Game Reserve – Mombasa
    description: |-
      Today you will have a morning game drive after breakfast. Return to check out and have an early lunch before being transferred to the airstrip for your 14:00 flight to Mombasa.

      On arrival at Mombasa airport, our representative will meet you and transfer you to the Hotel for an evening’s rest, dinner and overnight.
    overnight: Leopard Beach Resort & Spa
    mealPlan: Half Board

  - day: 8
    title: Mombasa – City Tour
    description: |-
      Today you will be picked up from the Hotel mid-morning for a city tour of the Old Town of Mombasa. The town is Kenya’s second largest city and where much of its heritage is found. It is home to a richly diverse mix of communities (locals, Arabs, Asians, Portuguese and the British) who have co-existed for hundreds of years. Their various social, political, religious and economic activities have created a distinct character and culture that defines the Old Town.

      The visible aspect of this unique character is a collection of historical buildings dating from the 18th century, combining African, Arabic and European influences. Many of these buildings still stand, with beautifully carved doors and elegantly styled balconies on their turn-of-the-century facades.

      You will visit Fort Jesus, a Portuguese fort built between 1593 and 1596 by order of King Philip of Portugal to guard the Old Port of Mombasa, now a UNESCO World Heritage Site. You will also visit the port of Mombasa.

      Lunch will be served at one of the Old Town’s restaurants. Return later for an afternoon rest on the beachfront.
    overnight: Leopard Beach Resort & Spa
    mealPlan: Half Board

  - day: 9
    title: Mombasa – Dhow Cruise
    description: |-
      Relax on the pristine beaches of Mombasa and enjoy the Hotel’s facilities, such as beach volleyball and the swimming pool. After lunch, you will have a once-in-a-lifetime experience on a dhow cruise, enjoying a sunset meal aboard a traditionally built boat.
    overnight: Leopard Beach Resort & Spa
    mealPlan: Half Board

  - day: 10
    title: Mombasa – Nairobi – Depart
    description: |-
      After your final breakfast at the Hotel, relax as you pack for today’s departure. You will then be transferred to Moi International Airport for your flight to Nairobi. On arrival at Jomo Kenyatta International Airport, you will connect to your onward international flight home.

      Thank you for choosing KSafaris as your preferred travel partner. We hope to see you again.

