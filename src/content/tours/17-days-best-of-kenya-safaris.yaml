title: 17 Days Best of Kenya Safaris
summary: >-
  Kenya end to end by private 4x4: Nairobi’s elephant orphanage and Giraffe Centre, Amboseli under
  Kilimanjaro, the Rift Valley lakes, Samburu, Ol Pejeta, Meru and four days in the Maasai Mara.
durationDays: 17
destinations: [kenya]
route:
  - Nairobi
  - Amboseli
  - Lake Naivasha
  - Samburu
  - Ol Pejeta
  - Meru
  - Lake Nakuru
  - Maasai Mara
heroImage: ../../assets/images/tours/17-days-best-of-kenya-safaris.jpg
heroAlt: Three white rhinos grazing beside Lake Nakuru, with flamingos lining the shore behind
featured: true
order: 2

itinerary:
  - day: 1
    title: Arrival – Nairobi
    description: |-
      Jambo and welcome to Kenya! On arrival at the airport, you will be met by our experienced guide and the regional Manager. After a short briefing, you will be transferred to your city hotel. The guide will give you an insight into the wonderful adventures ahead of your safari.
    overnight: Fairmont The Norfolk
    mealPlan: Bed & Breakfast

  - day: 2
    title: Nairobi Excursions
    description: |-
      Wake up for breakfast at your prestigious Hotel. After breakfast, you will have an excursion within Kenya’s capital, starting your exploration of this beautiful country with a city tour. You will then visit the David Sheldrick elephant orphanage at 11:00, a nursery and rehabilitation centre for infant elephants that have lost their families, as well as the occasional rhino, zebra and other wildlife. Daphne Sheldrick was the first person to successfully raise an orphaned infant elephant, discovering a formula that has now been used widely. The widow of the famous naturalist and warden of Tsavo from 1948 to 1976, David Sheldrick, Daphne dedicated her life to conservation. These infants are eventually released into the wild at Tsavo East National Park and end up in the care of other orphans who have been successfully reintroduced to the wild.

      After the visit, you will go for lunch in the Karen area.

      After lunch, you will visit the Karen Blixen Museum and the Giraffe Centre, which are close by. The Centre was set up as a breeding centre for the endangered Rothschild giraffe. It was started by Jock Leslie-Melville, the Kenyan grandson of a Scottish Earl, when he and his wife Betty captured a baby giraffe to start a programme of breeding giraffe in captivity at their home in Langata, now home to the Centre. Since then the programme has had huge success, resulting in the introduction of several breeding pairs of Rothschild giraffe into Kenyan national parks.

      You will then be dropped at your Hotel for dinner and overnight stay.
    overnight: Fairmont The Norfolk
    mealPlan: Bed & Breakfast

  - day: 3
    title: Nairobi – Amboseli National Park
    description: |-
      After a sumptuous breakfast at your first-class hotel, start exploring this beautiful country as you travel to Amboseli National Park, located at the foot of Africa’s highest mountain, Mount Kilimanjaro. Arrive for lunch followed by an afternoon game viewing drive.
    overnight: Amboseli Serena Safari Lodge or Kibo Safari Camp
    mealPlan: Full Board

  - day: 4 & 5
    title: Amboseli National Park
    description: |-
      Spend the entire day exploring this park that is rich in diversity, with full-day game drives. The Park is famous for its dramatic views of Kilimanjaro, the highest free-standing mountain in the world and the highest peak on the African continent. Kilimanjaro, at 19,340 ft (5,894 m), rises dramatically out of the 4,000 ft (1,200 m) Amboseli plains. Amboseli is also famous for its elephant herds, which have been followed and documented by world-renowned researcher Cynthia Moss.

      All meals will be served at the Lodge.
    overnight: Amboseli Serena Safari Lodge or Kibo Safari Camp
    mealPlan: Full Board

  - day: 6
    title: Amboseli – Lake Naivasha
    description: |-
      After a sumptuous breakfast at your Lodge, you will depart for Lake Naivasha, one of Kenya’s freshwater lakes, arriving in time for a late lunch.

      After lunch, you will visit Hell’s Gate National Park, famous for its natural hot geysers and eagle and vulture breeding grounds. It is the only Park where visitors can walk or cycle past huge herds of buffalo looking on. The Park has special locations for great viewing including Fischer’s Tower (formerly a volcanic plug), the Central Tower and Njorowa Gorge. The hot springs and fabulous scenic landscape, besides the diverse game, are just incredible. Game includes buffaloes, giraffes, gazelles and zebras among others.

      After the Park, if time permits, you will take a leisurely boat ride to Crescent Island, a private wildlife sanctuary on the eastern side of Lake Naivasha. It is one of the most beautiful parks in Kenya and is often called Naivasha’s best-kept secret. Surrounded by water, it is actually a peninsula and is currently only accessible by boat. The shores host abundant birdlife including pelicans, cormorants, and fish eagles with their haunting cry. There are more animals per acre than in any other Kenyan park; you can see wildebeest, waterbuck, zebra and gazelle. The island is the submerged rim of a volcanic crater, where you can walk among the yellow-barked “fever trees” and enjoy a 360-degree view across the Lake from Longonot to Hell’s Gate, the Mau Escarpment, Eburu and on to the Aberdares.

      Return later for dinner and overnight.
    overnight: Enashipai Resort & Spa or Lake Naivasha Sopa Lodge
    mealPlan: Full Board (B, L, D)

  - day: 7
    title: Lake Naivasha – Samburu Game Reserve
    description: |-
      After breakfast, you will drive north, past vast vegetation and agricultural fields in what used to be called the ‘white highlands’. As you drive, you will notice different climatic conditions: warm, cold, then hot as you approach the Northern corridor. Arrive at your Camp in Samburu in time for lunch. After lunch, enjoy an afternoon game viewing drive.

      Samburu Game Reserve is unique in that it is home to the “Samburu Special Five”: the gerenuk, Somali ostrich, Beisa oryx, reticulated giraffe and Grevy’s zebra, found only in northern Kenya. Other animals found here include elephants, lions, impalas, cheetahs, civet cats, African wild dogs, hippos and a variety of bird species, with over 350 recorded.

      After the game drive, return to your Camp for dinner and overnight.
    overnight: Elephant Bedroom Camp
    mealPlan: Full Board (B, L, D)

  - day: 8
    title: Inside the Samburu Game Reserve
    description: |-
      Spend the entire day inside this beautiful reserve, owned by the local community and managed by the local government. Enjoy the undulating landscapes, the warm and sometimes hot weather, the friendly local residents and immense wildlife. Mid-morning, you will visit one of the Samburu villages and learn about their unique lifestyle. The Samburu are Maa speakers who are cousins of the Maasai people. For ages they have preserved their culture, and their traditions still hold to this day. Their beadwork, songs and dance and colourful ceremonies make them one of the most traditional communities in Kenya.

      Enjoy full-day game drives. All meals will be served at your Camp.
    overnight: Elephant Bedroom Camp
    mealPlan: Full Board (B, L, D)

  - day: 9
    title: Samburu – Ol Pejeta Conservancy, Nanyuki
    description: |-
      After breakfast at your Camp, you will drive down to the foot of Kenya’s highest mountain, Mt. Kenya. Here you will experience drastic weather changes as it gets colder towards the mountain, and on a clear day you will be able to see the highest peak. Arrive in time for lunch at Ol Pejeta Conservancy.

      This conservancy is home to the last remaining northern white rhinos in the world. Sadly Sudan, the last male, died on 19 March 2018 due to age-related complications, but two females remain, heavily guarded within the conservancy’s endangered species boma. You will have the once-in-a-lifetime experience of getting up close to them and hearing their story. Other animals to see include Jackson’s hartebeest, Grevy’s zebra and chimpanzees, among others.

      Dinner and overnight will be at the Camp.
    overnight: Sweetwaters Tented Camp
    mealPlan: Full Board (B, L, D)

  - day: 10
    title: Ol Pejeta Conservancy – Meru National Park
    description: |-
      After breakfast at your Camp, you will drive to Meru National Park, arriving in time for lunch and later an afternoon game drive. This 870 km², less-visited park is a beautiful gem. On a magnificent scale, Meru features luxuriant jungle, coursing rivers, verdant swamp, khaki grasslands and gaunt termite cathedrals, all under the sky’s great blue bowl. Little visited and utterly unspoilt, few places compare with the remote and rugged atmosphere found here. Visitors can see Grevy’s zebras, elephants, Bohor reedbucks, hartebeests, pythons, puff adders, cobras, buffalos and more than 427 recorded species of birds.

      After the game drive, return for dinner and overnight.
    overnight: Ikweta Safari Camp
    mealPlan: Full Board

  - day: 11
    title: Meru National Park
    description: |-
      Spend the entire day exploring Meru National Park.

      The national park receives an abundance of rain, allowing tall grasses to grow and rich swamps to develop, making it a wildlife haven. The Tana, Rojewero and Ura rivers are the main sources of water, and each of these rivers and their tributaries is lined with riverine forest and stands of doum and raphia palms. The northern section of the park features rainforest, while most of the park is covered in bush and grassland of varying density, with the famous acacia trees that Africa is known for.

      Wildlife is varied and plentiful. Common species include elephant, giraffe, black rhino, white rhino, kudu, gazelle, hartebeest, reedbuck, zebra and hippo, and the rivers are highly populated with hippos. Predators include lion, leopard, cheetah, jackal, African wild cat and hyena. Birdwatchers will be happy to learn there are 427 species to check off, and snake enthusiasts can hope to see pythons, puff adders and cobras. River safaris are one of the best ways to spot the birds that live along the banks, and ostrich can be found in the bushy grasslands.

      Meru National Park is where George and Joy Adamson raised the lioness named Elsa, a story shared in the book and film Born Free. The Tana River and Adamson’s Falls, a cascading waterfall across rugged rocky terrain, are also key features of the park.

      All meals will be served at the Camp.
    overnight: Ikweta Safari Camp
    mealPlan: Full Board

  - day: 12
    title: Meru National Park – Lake Nakuru National Park
    description: |-
      After a sumptuous breakfast at the Camp, you will drive past Kenya’s highest mountain, Mt. Kenya, crossing the equator and some beautiful landscape down to one of Kenya’s Great Rift Valley lakes, Lake Nakuru. Arrive in time for lunch.

      The park offers excellent bird watching and game viewing, with slightly over 315 bird species and over 56 mammal species recorded. Wildlife includes the Eastern black rhino, southern white rhino, Rothschild giraffe, waterbuck, rock pythons, gazelle and baboon among others. Hundreds of lesser and greater flamingos dominate the lake and make it even more attractive; other main birds are cormorants and pelicans. Visit Baboon Cliff for a 360-degree view of the entire lake.

      After enjoying the afternoon game drive, you will stay overnight at a Lodge inside the Park.
    overnight: Sarova Lion Hill Lodge
    mealPlan: Full Board (B, L, D)

  - day: 13 & 14
    title: Lake Nakuru – Maasai Mara National Reserve
    description: |-
      After a leisurely al fresco breakfast, you will drive to the extraordinary destination of the Maasai Mara. The journey by road takes you across the floor of the Great Rift Valley, where you will notice recent fissures caused by tectonic movements, thought to have been aggravated by heavy rainfall in 2018 and 2023. These cut huge, long trenches through farms, roads and even buildings for several kilometres. Arrive at the Maasai Mara Reserve for lunch. After lunch you will have a rest, and then at about 16:00 an evening game viewing drive. You will spend the first two days at a Lodge in the west of the Mara.

      The Maasai Mara is perhaps one of the most prolific and famous reserves in Africa. Apart from being home to the famous Big Five (lion, leopard, rhino, African elephant and buffalo) and featuring in hundreds of films including the ‘Big Cat Diaries’, the reserve is celebrated as the Seventh Wonder of the World thanks to the annual wildebeest migration between July and September. This natural phenomenon is quite incredible: over 1.3 million wildebeest cross the Mara River from the Serengeti; many are swept away by currents, and hundreds of predators find easy prey. With crocodiles in the river, lions, cheetahs, hyenas and wild dogs waiting on land and vultures in the skies, it is a spectacle you will never tire of watching.

      Later, before dusk, return for dinner and overnight at your Lodge.
    overnight: Mara Serena Safari Lodge
    mealPlan: Full Board (B, L, D daily)

  - day: 15 & 16
    title: Inside the Maasai Mara Game Reserve
    description: |-
      These two days you will spend on game drives leaning towards the eastern side of the reserve. You will have an early game drive, when you are likely to see more wildlife as this is their most active time. Return for breakfast, then mid-morning visit a Maasai village (manyatta) where you will see their traditional beadwork and learn about their culture. After lunch, you will have another game drive until late in the evening. Return for dinner and overnight.

      Optional activity: you may choose a balloon ride, usually followed by a bush breakfast. It’s the best way to view wildlife from the air.
    overnight: Mara Serena Safari Lodge
    mealPlan: Full Board (B, L, D daily)

  - day: 17
    title: Maasai Mara Game Reserve – Nairobi – Depart
    description: |-
      You can have an early game drive, and then return for breakfast at the Lodge. After breakfast, you will depart back to Nairobi. You will have lunch (own account) in Kenya’s capital city or do some shopping in Nairobi, before being transferred to the airport for your departure flight back home.

      Your guide will drop you at least 3 hours before your scheduled departure time.

included:
  - Private transport in a 4x4 safari Land Cruiser with open roof for easy game viewing
  - Return airport transfers in Nairobi
  - Full-day excursions in Nairobi with lunch & dinner
  - Accommodation on Full Board on safari and Bed & Breakfast in Nairobi
  - Park entry fees and conservancy fees
  - Services of a professional English-speaking guide
  - Full-day game drives in the parks and reserves
  - Bottle of clean drinking water daily
  - A visit to the Samburu villages
  - Flying Doctors service in case of an emergency

excluded:
  - International flights
  - Visas and visa fees
  - Tips and gratuities
  - Items of personal use
  - Extra activities, e.g. Maasai village visit or balloon rides (can be pre-booked)
  - Change of accommodation other than what is on the itinerary
  - Sundowners (can be arranged on request)
